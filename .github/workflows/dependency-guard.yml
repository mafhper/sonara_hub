name: Dependency Guard

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Toda terça 12:00 UTC (09:00 America/Sao_Paulo), junto do Dependabot.
    # A main nunca era auditada; advisories novos ficavam invisíveis até um PR.
    - cron: "0 12 * * 2"

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=high

      - name: Dependency Review
        # A action de review só funciona em pull_request. Nos eventos push/schedule,
        # o gate é o `npm audit --audit-level=high` acima.
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
